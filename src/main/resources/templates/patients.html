<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CareSync - Patient Directory</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4 text-center">CareSync Patient Directory</h2>

    <div class="d-flex justify-content-end mb-3">

        <a th:href="@{/patients/new}"
           class="btn btn-primary">
            Register New Patient
        </a>

    </div>

    <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Patient Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Medical History</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="patient : ${listPatients}">

            <td th:text="${patient.id}"></td>

            <td th:text="${patient.patientName}"></td>

            <td th:text="${patient.age}"></td>

            <td th:text="${patient.emailId}"></td>

            <td th:text="${patient.medicalHistory}"></td>

            <td>

                <a th:href="@{/patients/edit/{id}(id=${patient.id})}"
                   class="btn btn-warning btn-sm">
                    Update
                </a>

                <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this patient?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
