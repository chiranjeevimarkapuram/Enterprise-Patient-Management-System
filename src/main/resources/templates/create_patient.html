<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CareSync - Register Patient</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Register New Patient</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/patients/save}"
                  th:object="${patient}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">
                        Patient Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter patient name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Age
                    </label>

                    <input type="number"
                           th:field="*{age}"
                           class="form-control"
                           placeholder="Enter age"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           placeholder="Enter email">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Medical History
                    </label>

                    <textarea th:field="*{medicalHistory}"
                              class="form-control"
                              rows="4"
                              placeholder="Enter medical history"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save Patient
                </button>

                <a th:href="@{/patients}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
