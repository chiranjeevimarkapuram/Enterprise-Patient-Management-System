<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Update Patient</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <h2>Update Patient</h2>

    <hr>

    <form th:action="@{/patients/save}"
          th:object="${patient}"
          method="post"
          style="max-width:500px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">

            <label class="form-label">Patient Name</label>

            <input type="text"
                   th:field="*{patient_name}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">Age</label>

            <input type="number"
                   th:field="*{age}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   th:field="*{email_id}"
                   class="form-control">
        </div>

        <div class="mb-3">

            <label class="form-label">Medical History</label>

            <textarea th:field="*{medicalHistory}"
                      class="form-control"
                      rows="3"></textarea>
        </div>

        <button type="submit"
                class="btn btn-primary">
            Update Patient
        </button>

        <a th:href="@{/patients}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
